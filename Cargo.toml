[package]
name = "win-wsl-usbipd"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "A keyboard-driven Windows terminal tool for attaching USB devices to WSL2"
license = "MIT"
readme = "README.md"
repository = "https://github.com/lk888l/win-wsl-usbipd"
keywords = ["usb", "wsl", "usbipd", "terminal", "windows"]
categories = ["command-line-utilities"]

[[bin]]
name = "wsl-usb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

